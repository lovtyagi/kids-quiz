<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Quiz</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Comic Sans MS", sans-serif;
    background:linear-gradient(180deg,#FFECB3,#FFE082);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.quiz-card{
    background:white;
    width:90%;
    max-width:420px;
    border-radius:24px;
    padding:22px;
    box-shadow:0 12px 30px rgba(0,0,0,0.15);
}

h2{
    margin:0 0 10px;
    color:#FF7043;
}

.progress-text{
    font-size:14px;
    margin-bottom:6px;
    color:#555;
}

.progress-bar{
    width:100%;
    height:10px;
    background:#EEE;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:18px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#66BB6A,#43A047);
    transition:width .4s ease;
}

.question{
    font-size:20px;
    font-weight:bold;
    color:#333;
    margin-bottom:16px;
}

.option-btn{
    width:100%;
    padding:14px;
    margin:8px 0;
    font-size:18px;
    border-radius:16px;
    border:none;
    cursor:pointer;
    background:#E3F2FD;
}

.option-btn.correct{
    background:#C8E6C9;
}

.option-btn.wrong{
    background:#FFCDD2;
}

.message{
    font-size:20px;
    font-weight:bold;
    margin-top:14px;
}

.result{
    text-align:center;
}

</style>
</head>

<body>

<div class="quiz-card" id="card">

<h2>🧠 Daily Quiz</h2>

<div class="progress-text" id="progressText"></div>

<div class="progress-bar">
<div class="progress-fill" id="progressFill"></div>
</div>

<div class="question" id="question"></div>

<div id="options"></div>

<div class="message" id="message"></div>

</div>

<script>

const DAY_NUMBER = 65;

const QUESTIONS = [{"question":"What color is the sun?","options":["Pink","Green","Blue","Yellow"],"correctIndex":3},{"question":"Which fruit is yellow?","options":["Apple","Cherry","Grapes","Banana"],"correctIndex":3},{"question":"Which vehicle moves on water?","options":["Bus","Boat","Car","Train"],"correctIndex":1},{"question":"Which vehicle flies in the sky?","options":["Airplane","Bus","Train","Boat"],"correctIndex":0},{"question":"What do we wear on our feet?","options":["Belt","Cap","Shoes","Gloves"],"correctIndex":2},{"question":"Which shape has three sides?","options":["Triangle","Square","Circle","Oval"],"correctIndex":0},{"question":"Which shape has four equal sides?","options":["Triangle","Square","Oval","Circle"],"correctIndex":1},{"question":"Which shape has three sides?","options":["Oval","Square","Circle","Triangle"],"correctIndex":3},{"question":"Which body part helps us smell?","options":["Eyes","Feet","Ears","Nose"],"correctIndex":3},{"question":"What color is chocolate?","options":["Red","Blue","Brown","Silver"],"correctIndex":2}];

let index = 0;
let score = 0;
let locked = false;

function loadQuestion(){

    locked = false;

    document.getElementById("message").innerText = "";

    document.getElementById("progressText").innerText =
        `Question ${index + 1} of ${QUESTIONS.length}`;

    document.getElementById("progressFill").style.width =
        ((index) / QUESTIONS.length) * 100 + "%";

    document.getElementById("question").innerText =
        QUESTIONS[index].question;

    const optionsDiv = document.getElementById("options");

    optionsDiv.innerHTML = "";

    QUESTIONS[index].options.forEach((opt,i)=>{

        const btn = document.createElement("button");

        btn.className = "option-btn";

        btn.innerText = opt;

        btn.onclick = ()=>checkAnswer(btn,i===QUESTIONS[index].correctIndex);

        optionsDiv.appendChild(btn);

    });

}

function checkAnswer(button,isCorrect){

    if(locked) return;

    locked = true;

    if(isCorrect){

        score++;

        button.classList.add("correct");

        showMessage("🎉 Great Job!","#4CAF50");

        setTimeout(nextQuestion,800);

    }else{

        button.classList.add("wrong");

        showMessage("😊 Try Again!","#F44336");

        locked = false;

    }

}

function showMessage(text,color){

    const msg = document.getElementById("message");

    msg.innerText = text;

    msg.style.color = color;

}

function nextQuestion(){

    index++;

    if(index < QUESTIONS.length){

        loadQuestion();

    }else{

        finishQuiz();

    }

}

function finishQuiz(){

    document.getElementById("card").innerHTML = `
        <div class="result">
            <h1>🏆 Well Done!</h1>
            <p>You scored <b>${score}</b> out of <b>${QUESTIONS.length}</b></p>
        </div>
    `;

 setTimeout(() => {
        Android.onQuizCompleted(score, QUESTIONS.length);
    }, 500);

}

loadQuestion();

</script>

</body>
</html>
